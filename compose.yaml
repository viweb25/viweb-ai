name: vi-websync-backend
x-runtime: &runtime
  image: ${BACKEND_IMAGE:-vi-websync/backend:staging}
  build:
    context: .
    dockerfile: Dockerfile
    target: base
  init: true
  restart: unless-stopped
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vi}
      POSTGRES_DB: ${POSTGRES_DB:-viws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${DB_MIGRATION_IMAGE:-vi-websync/db:staging}
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the migration database URL}
    command: ["alembic", "-c", "database/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the runtime database URL}
      APP_ORIGIN: ${APP_ORIGIN:?Set the frontend HTTPS origin}
      INFERENCE_URL: http://ai-api:8001
      REDIS_CACHE_URL: redis://redis:6379/1
      VI_DEMO_IMAGE_DIR: ""
    command: ["uvicorn", "vi_api.bootstrap:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "${GATEWAY_IP:-172.30.85.2}"]
    networks:
      default: {}
      gateway:
        ipv4_address: ${API_GATEWAY_IP:-172.30.85.3}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    image: caddy:2.10-alpine
    environment:
      BACKEND_SITE: ${BACKEND_SITE:?Set the backend HTTPS hostname}
      VI_GATEWAY_KEY: ${VI_GATEWAY_KEY:?Set the shared gateway key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
    networks:
      gateway:
        ipv4_address: ${GATEWAY_IP:-172.30.85.2}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  worker:
    <<: *runtime
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "worker.app:app", "worker", "--loglevel=info", "--concurrency=2", "--queues=platform"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  ai-api:
    image: ${AI_RUNTIME_IMAGE:-vi-websync/inference:staging}
    restart: unless-stopped
    environment:
      VI_DEMO_OLLAMA_URL: ${VI_DEMO_OLLAMA_URL:-}
      VI_DEMO_VISION_MODEL: ${VI_DEMO_VISION_MODEL:-qwen2.5vl:3b}
      VI_YOLO_WEIGHTS: ${VI_YOLO_WEIGHTS:-}
    volumes:
      - ${YOLO_MODEL_DIR:-yolo_models}:/models:ro
    command: ["uvicorn", "vi_inference.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:0.16.3
    profiles: ["vision"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - models:/root/.ollama
    restart: unless-stopped

networks:
  gateway:
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:-172.30.85.0/24}
volumes:
  postgres:
  redis:
  tls:
  models:
  yolo_models:
