name: vi-websync
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vi_local}
      POSTGRES_DB: ${POSTGRES_DB:-viws}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ..
      dockerfile: infra/docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vi_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vi_local_storage_only}
    ports: ["127.0.0.1:${S3_PORT:-19000}:9000", "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"]
    volumes: ["objectdata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  mlflow:
    build:
      context: ..
      dockerfile: infra/docker/mlflow.Dockerfile
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports: ["127.0.0.1:${MLFLOW_PORT:-15000}:5000"]
    volumes: ["mlflowdata:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
  redisdata:
  objectdata:
  mlflowdata:
